<svg xmlns="http://www.w3.org/2000/svg" width="876.9999999999999" height="320" viewBox="0 0 876.9999999999999 320" role="img"><title>Scrolled goal-board help retaining quit instructions on a short terminal</title><rect width="100%" height="100%" rx="10" fill="#0b1020"/><g fill="#e6edf3" font-family="Consolas, Liberation Mono, monospace" font-size="14" xml:space="preserve"><text x="16" y="24"> Project Goals · evidence                                        ○ 2 · ✓ 1 · Open · ⇅ File · 2 of 3 </text><text x="16" y="42">╭─ Keys ───────────────────────────────────────────────────────────────────────────────────────────╮</text><text x="16" y="60">│ c / r / x   Complete, reopen, or archive (asks first)                                            │</text><text x="16" y="78">│ d           Delete permanently (asks first)                                                      │</text><text x="16" y="96">│ f           Cycle the status filter                                                              │</text><text x="16" y="114">│ o           Cycle the order: file, status, recent                                                │</text><text x="16" y="132">│ K / J       Move the selected goal up or down (file order only)                                  │</text><text x="16" y="150">│ /           Search titles and descriptions                                                       │</text><text x="16" y="168">│ R           Reload from disk                                                                     │</text><text x="16" y="186">│ ?           Show this help                                                                       │</text><text x="16" y="204">│ q / esc     Quit                                                                                 │</text><text x="16" y="222">│                                                                                                  │</text><text x="16" y="240">│ Press esc to return, ↑ ↓ to scroll.                                                              │</text><text x="16" y="258">╰────────────────────────────────────────────────────────────────────────────── 10 above · 0 below ╯</text><text x="16" y="276"> No active goal. Press s to make one active.</text><text x="16" y="294"> ↑↓ scroll · esc close</text></g></svg>